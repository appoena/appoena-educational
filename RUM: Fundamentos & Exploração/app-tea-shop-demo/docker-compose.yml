services:
  datadog:
    image: 'datadog/agent:latest'
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_TAGS='env:dev'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    ports:
      - 127.0.0.1:8126:8126/tcp
    depends_on:
      - backend
      - frontend

  backend:
    build:
      context: ./backend
    container_name: tea-shop-backend
    environment:
      DD_ENV: ${DD_ENV:-dev}
      DD_SERVICE: ${DD_SERVICE:-tea-shop-demo}
      DD_VERSION: ${DD_VERSION:-1.0.0}
      DD_AGENT_HOST: ${DD_AGENT_HOST:-datadog}
      DD_LOGS_INJECTION: ${DD_LOGS_INJECTION:-true}
      DD_TRACE_ENABLED: ${DD_TRACE_ENABLED:-true}
      NODE_ENV: production
      PORT: 3000
      MIN_LATENCY_MS: 100
      MAX_LATENCY_MS: 1500
      ERROR_RATE: 0.03
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: tea-shop-frontend
    environment:
      VITE_DD_APPLICATION_ID: ${VITE_DD_APPLICATION_ID:-}
      VITE_DD_CLIENT_TOKEN: ${VITE_DD_CLIENT_TOKEN:-}
      VITE_DD_SITE: ${VITE_DD_SITE:-datadoghq.com}
      VITE_DD_ENV: ${VITE_DD_ENV:-local}
      VITE_DD_SERVICE: ${VITE_DD_SERVICE:-tea-shop-demo}
      VITE_DD_VERSION: ${VITE_DD_VERSION:-1.0.0}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  bot:
    build:
      context: ./bot
    container_name: tea-shop-bot
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://frontend:5173}
      BOT_CONCURRENCY: ${BOT_CONCURRENCY:-3}
      BOT_MIN_DELAY_MS: ${BOT_MIN_DELAY_MS:-300}
      BOT_MAX_DELAY_MS: ${BOT_MAX_DELAY_MS:-3000}
      BOT_HEADLESS: ${BOT_HEADLESS:-true}
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
